"tab.stats" = "toplevel_resizable_side1"
"tab.inventory" = "toplevel_resizable_side3"
"tab.worn" = "toplevel_resizable_side4"
"tab.friends" = "toplevel_resizable_side9"
"tab.logout" = "toplevel_resizable_side10"
"tab.music" = "toplevel_resizable_side13"
"tab.settings" = "toplevel_resizable_side11"
modal = "toplevel_resizable_mainmodal"
"modal.side" = "toplevel_resizable_sidemodal"
floater = "toplevel_resizable_floater"
"hud.hp" = "toplevel_resizable_hpbar_hud"
